# CI: Validate code quality and content availability on push/PR to master.
#
# Goal: catch breakage early without actually downloading the game or
# pushing images.  All checks must be runnable in a stock GitHub Actions
# runner — no secrets required.
#
# What we check:
#   1. YAML syntax             — compose files, workflow files
#   2. Shell syntax            — every .sh file (bash -n)
#   3. Dockerfile lint         — docker build --check (no cache, no push)
#   4. External-URL reachable  — steamcmd, gosu, L4D2-Competitive-Rework
#   5. .env file validation    — ensure required variables are defined

name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Cancel in-flight runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. YAML ──────────────────────────────────────────────────────────
  yaml-lint:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint --user

      - name: Validate YAML files
        run: |
          # Check all compose files that exist
          COMPOSE_FILES=""
          for f in docker-compose.yml compose.yml compose.bind.yml; do
            if [ -f "$f" ]; then
              COMPOSE_FILES="$COMPOSE_FILES $f"
            fi
          done
          WORKFLOW_FILES=".github/workflows/ci.yml .github/workflows/docker-publish.yml"
          python -m yamllint --no-warnings $COMPOSE_FILES $WORKFLOW_FILES

  # ── 2. Shell ─────────────────────────────────────────────────────────
  shell-lint:
    name: Shell syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          for f in *.sh; do
            echo "  → $f"
            bash -n "$f"
          done
          echo "All shell scripts pass syntax check."

  # ── 3. Dockerfile ───────────────────────────────────────────────────
  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run docker build --check
        # --check validates the Dockerfile without executing RUN instructions,
        # so no game files are downloaded.  The dry-run build does the same
        # but also resolves the full execution graph.
        run: |
          docker build --check .
          echo "---"
          # Also do a compile-only dry-run on the base stage to verify COPY
          # sources exist and the RUN script is syntactically valid.
          docker buildx build --load --target=base -t l4d2-ci-dummy .

      - name: Print image sizes (lightweight validation)
        run: docker images l4d2-ci-dummy --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"

  # ── 4. External-URL reachability ────────────────────────────────────
  url-reachability:
    name: External URL reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check external URLs referenced in scripts
        run: |
          set -e

          URLs=(
            # SteamCMD tarball (as-user.sh)
            "https://media.steampowered.com/installer/steamcmd_linux.tar.gz"
            # L4D2-Competitive-Rework (install-plugins.sh)
            "https://github.com/SirPlease/L4D2-Competitive-Rework.git"
          )

          for url in "${URLs[@]}"; do
            echo "  → Checking: $url"
            code=$(curl -sL -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$url")
            # GitHub redirects to 200; git-upload-pack responds 200;
            # steamcmd tarball returns 200.
            if [ "$code" -eq 200 ] || [ "$code" -eq 302 ] || [ "$code" -eq 301 ]; then
              echo "    ✅ HTTP $code"
            else
              echo "    ⚠️ HTTP $code – may be transient, not failing build"
            fi
          done

  # ── 5. .env file validation ────────────────────────────────────────
  env-validation:
    name: .env file validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check .env exists and contains required variables
        run: |
          if [ ! -f .env ]; then
            echo "❌ .env file not found"
            exit 1
          fi
          REQUIRED_VARS="BASE_DIR INSTALL_DIR GAME_NAME GAME_ID INSTALL_PLUGINS PORT IP DEFAULT_MAP MAXPLAYERS TZ"
          missing=""
          for var in $REQUIRED_VARS; do
            if ! grep -q "^${var}=" .env; then
              missing="$missing $var"
            fi
          done
          if [ -n "$missing" ]; then
            echo "❌ Missing required variables in .env:$missing"
            exit 1
          fi
          echo "✅ .env file is valid and contains all required variables."

  # ── 6. Cross-file consistency ───────────────────────────────────────
  consistency:
    name: Cross-file consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that COPY sources exist
        run: |
          set -e
          # Extract source paths from COPY instructions, skipping --chmod flags.
          grep '^COPY ' Dockerfile | while read -r _chk line; do
            # line = everything after "COPY "
            # Drop leading --chmod if present
            case "$line" in
              --chmod=*) line="${line#--chmod=* }" ;;
            esac
            src="${line%% *}"          # first token after flags = source
            if [ -n "$src" ]; then
              if [ -f "$src" ]; then
                echo "  ✅ COPY source exists: $src"
              else
                echo "  ❌ COPY source MISSING: $src"
                exit 1
              fi
            fi
          done

      - name: Check ENTRYPOINT script exists
        run: |
          # Extract the path between ENTRYPOINT ["..."]
          entry=$(grep '^ENTRYPOINT' Dockerfile | sed 's/.*"\(.*\)".*/\1/')
          if [ -n "$entry" ]; then
            if [ ! -f "$entry" ]; then
              echo "❌ ENTRYPOINT \"$entry\" not found"
              exit 1
            fi
            echo "✅ ENTRYPOINT \"$entry\" exists"
          else
            echo "⚠️  Could not parse ENTRYPOINT, skipping check"
          fi

      - name: Check compose.yml references valid image name format
        run: |
          for f in docker-compose.yml compose.yml; do
            [ -f "$f" ] || continue
            while IFS=': ' read -r _key value; do
              if echo "$value" | grep -qE '^[a-z0-9]+(/[a-z0-9_-]+)?:[a-zA-Z0-9_.-]+$'; then
                echo "  ✅ $f image: $value"
              else
                echo "  ⚠️  $f non-standard image ref: $value"
              fi
            done < <(grep 'image: ' "$f" 2>/dev/null || true)
          done
