# CI: Validate code quality and content availability on push/PR to master.
#
# Goal: catch breakage early without actually downloading the game or
# pushing images.  All checks must be runnable in a stock GitHub Actions
# runner — no secrets required.
#
# What we check:
#   1. YAML syntax             — compose files, workflow files
#   2. Shell syntax            — every .sh file (bash -n)
#   3. Dockerfile lint         — docker build --check (no cache, no push)
#   4. External-URL reachable  — steamcmd, gosu, L4D2-Competitive-Rework
#   5. Cross-file consistency  — COPY sources exist, compose refs match &c.

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Cancel in-flight runs for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. YAML ──────────────────────────────────────────────────────────
  yaml-lint:
    name: YAML syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install yamllint
        run: pip install yamllint --user

      - name: Validate YAML files
        run: |
          yamllint --no-warnings \
            compose.yml compose.bind.yml \
            .github/workflows/ci.yml \
            .github/workflows/docker-publish.yml

  # ── 2. Shell ─────────────────────────────────────────────────────────
  shell-lint:
    name: Shell syntax (bash -n)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell syntax
        run: |
          for f in *.sh; do
            echo "  → $f"
            bash -n "$f"
          done
          echo "All shell scripts pass syntax check."

  # ── 3. Dockerfile ───────────────────────────────────────────────────
  dockerfile-lint:
    name: Dockerfile lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run docker build --check
        # --check validates the Dockerfile without executing RUN instructions,
        # so no game files are downloaded.  The dry-run build does the same
        # but also resolves the full execution graph.
        run: |
          docker build --check .
          echo "---"
          # Also do a compile-only dry-run on the base stage to verify COPY
          # sources exist and the RUN script is syntactically valid.
          docker buildx build --load --target=base -t l4d2-ci-dummy .

      - name: Print image sizes (lightweight validation)
        run: docker images l4d2-ci-dummy --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}"

  # ── 4. External-URL reachability ────────────────────────────────────
  url-reachability:
    name: External URL reachability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check external URLs referenced in scripts
        run: |
          set -e

          URLs=(
            # SteamCMD tarball (as-user.sh)
            "https://media.steampowered.com/installer/steamcmd_linux.tar.gz"
            # Gosu binary (as-root.sh)
            "https://github.com/tianon/gosu/releases/download/1.17/gosu-amd64"
            # L4D2-Competitive-Rework (entrypoint.sh)
            "https://github.com/SirPlease/L4D2-Competitive-Rework.git"
          )

          for url in "${URLs[@]}"; do
            echo "  → Checking: $url"
            code=$(curl -sL -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$url")
            # GitHub redirects to 200; git-upload-pack responds 200;
            # steamcmd tarball returns 200.
            if [ "$code" -eq 200 ] || [ "$code" -eq 302 ] || [ "$code" -eq 301 ]; then
              echo "    ✅ HTTP $code"
            else
              echo "    ⚠️ HTTP $code – may be transient, not failing build"
            fi
          done

  # ── 5. Cross-file consistency ───────────────────────────────────────
  consistency:
    name: Cross-file consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that COPY sources exist
        run: |
          set -e
          # Parse COPY --chmod lines from Dockerfile and verify each source
          # exists relative to the repo root.
          while IFS=' ' read -r _ src _; do
            # Discard flags like --chmod=755 (they may appear after COPY)
            src=${src#--chmod=*}
            if [ -z "$src" ]; then continue; fi
            src=$(echo "$src" | tr -d '.')
            # Re-extract: COPY [--chmod=N] src dst
            src=$(grep -oP '(?<=COPY\s.*?)\S+' Dockerfile | head -1)
          done <<< "$(grep '^COPY ' Dockerfile)"
          # Simpler approach: just extract the source token after COPY
          grep '^COPY ' Dockerfile | while read -r line; do
            # Strip leading COPY and any --chmod=xxx
            src=$(echo "$line" | awk '{for(i=1;i<=NF;i++) if(!match($i,/^--/)) print $i}' | head -1)
            if [ -n "$src" ]; then
              if [ -f "$src" ]; then
                echo "  ✅ COPY source exists: $src"
              else
                echo "  ❌ COPY source MISSING: $src"
                exit 1
              fi
            fi
          done

      - name: Check ENTRYPOINT script exists
        run: |
          entry=$(grep -oP '(?<=ENTRYPOINT\s\[").*?(?="\])' Dockerfile || true)
          if [ -n "$entry" ] && [ ! -f "$entry" ]; then
            echo "❌ ENTRYPOINT $entry not found"
            exit 1
          fi
          echo "✅ ENTRYPOINT $entry exists"

      - name: Check compose.yml references valid image name format
        run: |
          img=$(grep -oP '(?<=image: ).+' compose.yml compose.bind.yml)
          for i in $img; do
            if echo "$i" | grep -qP '^[a-z0-9]+(/[a-z0-9_-]+)?:[a-zA-Z0-9_.-]+$'; then
              echo "  ✅ Image reference: $i"
            else
              echo "  ⚠️  Non-standard image ref: $i"
            fi
          done

      - name: Check environment variable consistency across files
        run: |
          # Variables that appear in entrypoint.sh (defaults) should be
          # documented/used in compose files too.
          expected_vars="PORT TZ SSH_PUBLIC_KEY INSTALL_DIR GAME_ID IP MAXPLAYERS"
          for var in $expected_vars; do
            in_compose=$(grep -c "$var" compose.yml compose.bind.yml 2>/dev/null || echo 0)
            in_sh=$(grep -c "$var" entrypoint.sh as-user.sh 2>/dev/null || echo 0)
            if [ "$in_sh" -gt 0 ]; then
              if [ "$in_compose" -eq 0 ]; then
                echo "  ⚠️  $var is used in shell scripts but not referenced in compose files"
              else
                echo "  ✅ $var: consistent across files"
              fi
            fi
          done
