# L4D2 dedicated server - deployment using host bind mounts.
#
# Game files and config/plugin data are stored in directories on the host, so
# you can inspect / edit them directly.
#
# On first `docker compose up`, the host directories are created automatically.
# The container (running as root during startup) chowns the game directory to
# UID 1000 ("louis"); the plugin step similarly chowns /addons, /cfg, /scripts.
# If you want to edit those directories from the host as a different user,
# either run as UID 1000 or `chown` them to your own UID afterwards.
#
# If you change INSTALL_DIR, also change the ./l4d2 mount path below.

services:
  l4d2:
    image: kevonlin/l4d2:latest
    container_name: l4d2
    restart: unless-stopped
    ports:
      - "27015:27015"
      - "27015:27015/udp"
    environment:
      PORT: 27015
      TZ: Asia/Shanghai
      SSH_PUBLIC_KEY: "ssh-ed25519 AAAA... replace-with-your-public-key"
    volumes:
      - ./l4d2:/home/louis/l4d2
      - ./addons:/addons
      - ./cfg:/cfg
      - ./scripts:/scripts
    networks:
      - l4d2-network

networks:
  l4d2-network:
