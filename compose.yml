# L4D2 dedicated server - deployment using Docker named volumes (recommended).
#
# The game and the config/plugin data live in Docker-managed volumes, so they
# survive container recreation (`docker compose down` / `up`). Only `docker
# compose down -v` removes the data.
#
# First start downloads & installs the game via SteamCMD (takes a while and
# needs a stable network). Subsequent starts only update/validate.

services:
  l4d2:
    image: kevonlin/l4d2:latest
    container_name: l4d2
    restart: unless-stopped
    ports:
      - "27015:27015"
      - "27015:27015/udp"
    environment:
      PORT: 27015
      TZ: Asia/Shanghai
      # Paste your SSH public key to enable SSH login as the "louis" user.
      SSH_PUBLIC_KEY: "ssh-ed25519 AAAA... replace-with-your-public-key"
      # Optional overrides:
      # GAME_ID: 222860          # Steam AppID of the game server
      # INSTALL_DIR: l4d2        # must match the game volume mount path below
    volumes:
      - l4d2-game:/home/louis/l4d2
      - addons:/addons
      - cfg:/cfg
      - scripts:/scripts
    networks:
      - l4d2-network

volumes:
  l4d2-game:
  addons:
  cfg:
  scripts:

networks:
  l4d2-network:
